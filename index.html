<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFE PASS - Smart Work Permit System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Top Navigation Bar -->
    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-bold text-blue-400">SAFE PASS</span>
                <span class="text-xs bg-blue-600 px-2 py-0.5 rounded text-white font-light">Smart Work Permit</span>
            </div>
            <div id="user-info-bar" class="hidden flex items-center space-x-4">
                <div class="text-right">
                    <p id="nav-user-name" class="text-sm font-semibold text-white">ผู้ใช้งาน</p>
                    <p id="nav-user-role" class="text-xs text-blue-300">สิทธิ์: General User</p>
                </div>
                <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded transition">
                    ออกจากระบบ
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-4 md:p-6">

        <!-- AUTH SECTION (Login / Sign Up) -->
        <div id="auth-section" class="max-w-md mx-auto my-12 bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
            <!-- Header Tabs -->
            <div class="flex border-b border-gray-200">
                <button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 py-3 font-semibold text-center text-blue-600 border-b-2 border-blue-600">
                    เข้าสู่ระบบ
                </button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="w-1/2 py-3 font-semibold text-center text-gray-500 hover:text-blue-600">
                    สมัครสมาชิก
                </button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล (Email)</label>
                    <input type="email" id="login_email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                    <input type="password" id="login_password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="form-signup" onsubmit="handleSignUp(event)" class="p-6 space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล *</label>
                    <input type="text" id="signup_fullname" placeholder="กรอกชื่อ-นามสกุล" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสพนักงาน / รหัสผู้รับเหมา *</label>
                    <input type="text" id="signup_empid" placeholder="เช่น EMP-102 หรือ CON-05" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมลสมัครใช้งาน (Email) *</label>
                    <input type="email" id="signup_email" placeholder="example@gmail.com" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ตั้งรหัสผ่าน (Password) *</label>
                    <input type="password" id="signup_password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทบัญชี / สิทธิ์ใช้งาน *</label>
                    <select id="signup_role" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="General User">ผู้ขออนุญาตทั่วไป / ผู้รับเหมา</option>
                        <option value="Safety Officer (จป.)">เจ้าหน้าที่ความปลอดภัย (จป.)</option>
                    </select>
                </div>
                <button type="submit" id="btn-signup" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg transition">
                    ยืนยันการสมัครสมาชิก
                </button>
            </form>
        </div>

        <!-- APP DASHBOARD SECTION -->
        <div id="app-section" class="hidden grid grid-cols-1 md:grid-cols-4 gap-6">
            
            <!-- Sidebar Menu -->
            <div class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm border border-gray-200 h-fit space-y-2">
                <button onclick="showPage('permit-form')" class="w-full text-left px-4 py-2.5 rounded-lg font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 flex items-center space-x-2">
                    <span>📝</span> <span>ยื่นขอใบอนุญาต (Work Permit)</span>
                </button>
                <button onclick="showPage('status-tracker')" class="w-full text-left px-4 py-2.5 rounded-lg font-medium text-gray-700 hover:bg-gray-100 flex items-center space-x-2">
                    <span>🔍</span> <span>ติดตามสถานะ</span>
                </button>
                <!-- ปุ่มพิจารณาอนุมัติ (จะเปิดให้กดเฉพาะเมื่อเป็น Safety) -->
                <button id="btn-safety-menu" onclick="showPage('safety-approval')" class="w-full text-left px-4 py-2.5 rounded-lg font-medium text-gray-400 bg-gray-50 cursor-not-allowed flex items-center justify-between" disabled>
                    <div class="flex items-center space-x-2">
                        <span>🛡️</span> <span>พิจารณาอนุมัติ (จป.)</span>
                    </div>
                    <span id="badge-lock" class="text-xs bg-gray-200 px-1.5 py-0.5 rounded text-gray-500">🔒 ล็อก</span>
                </button>
            </div>

            <!-- Content Area -->
            <div class="md:col-span-3 space-y-6">

                <!-- Page 1: แบบฟอร์มขอใบอนุญาต -->
                <div id="page-permit-form" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-6">
                    <h2 class="text-xl font-bold text-gray-800 border-b pb-3">ยื่นขอใบอนุญาตทำงาน (Work Permit)</h2>
                    <form onsubmit="handleWorkPermitSubmit(event)" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">ชื่อบริษัท / สังกัด *</label>
                                <input type="text" id="wp_company" required class="w-full mt-1 px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">พื้นที่ปฏิบัติงาน *</label>
                                <input type="text" id="wp_location" placeholder="ระบุอาคาร / ชั้น / ห้อง" required class="w-full mt-1 px-3 py-2 border rounded-lg">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">รายละเอียดลักษณะงาน *</label>
                            <textarea id="wp_description" rows="3" required class="w-full mt-1 px-3 py-2 border rounded-lg" placeholder="ระบุรายละเอียดงานที่ต้องปฏิบัติ..."></textarea>
                        </div>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium">
                            ส่งคำขออนุมัติ
                        </button>
                    </form>
                </div>

                <!-- Page 2: ติดตามสถานะ -->
                <div id="page-status-tracker" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
                    <h2 class="text-xl font-bold text-gray-800 border-b pb-3">รายการคำขอใบอนุญาตทั้งหมด</h2>
                    <div id="requests-list" class="space-y-3">
                        <p class="text-gray-500 text-sm">กำลังโหลดข้อมูล...</p>
                    </div>
                </div>

                <!-- Page 3: หน้าพิจารณาอนุมัติ (Safety Only) -->
                <div id="page-safety-approval" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h2 class="text-xl font-bold text-gray-800">รายการรอการพิจารณาอนุมัติ (สำหรับ จป.)</h2>
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Safety Panel</span>
                    </div>
                    <div id="safety-approval-list" class="space-y-3">
                        <p class="text-gray-500 text-sm">กำลังโหลดรายการรออนุมัติ...</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. ตั้งค่าการเชื่อมต่อ Supabase (ใส่ค่า URL และ Key ของคุณแล้ว)
        const SUPABASE_URL = 'https://oqthxncwleedvccganmg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bhnJ7U04RVjyByqFE5bqiQ_Qa_ffBNJ';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;

        // สลับแท็บ Login / Sign Up
        function switchAuthTab(type) {
            if (type === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-signup').classList.add('hidden');
                document.getElementById('tab-login').className = "w-1/2 py-3 font-semibold text-center text-blue-600 border-b-2 border-blue-600";
                document.getElementById('tab-signup').className = "w-1/2 py-3 font-semibold text-center text-gray-500 hover:text-blue-600";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-signup').classList.remove('hidden');
                document.getElementById('tab-signup').className = "w-1/2 py-3 font-semibold text-center text-blue-600 border-b-2 border-blue-600";
                document.getElementById('tab-login').className = "w-1/2 py-3 font-semibold text-center text-gray-500 hover:text-blue-600";
            }
        }

        // ระบบสมัครสมาชิก (Sign Up) พร้อมบันทึก Role ลงตาราง profiles อัตโนมัติ
        async function handleSignUp(event) {
            event.preventDefault();
            const fullname = document.getElementById('signup_fullname').value.trim();
            const empid = document.getElementById('signup_empid').value.trim();
            const email = document.getElementById('signup_email').value.trim();
            const password = document.getElementById('signup_password').value;
            const selectedRole = document.getElementById('signup_role').value;

            let finalRole = 'General User';
            if (selectedRole.includes('ความปลอดภัย') || selectedRole.includes('Safety')) {
                finalRole = 'Safety Officer (จป.)';
            }

            const btn = document.getElementById('btn-signup');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึกข้อมูล...';

            try {
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) throw error;

                if (data?.user) {
                    const { error: profileError } = await db.from('profiles').upsert([{
                        id: data.user.id,
                        fullname: fullname,
                        employee_id: empid,
                        role: finalRole,
                        updated_at: new Date()
                    }], { onConflict: 'id' });

                    if (profileError) throw profileError;
                }

                alert(`🎉 สมัครสมาชิกสำเร็จเรียบร้อย!\nสิทธิ์การใช้งานของคุณคือ: [${finalRole}]\nกรุณาเข้าสู่ระบบอีกครั้งครับ`);
                switchAuthTab('login');
            } catch (err) {
                console.error('Sign Up Error:', err);
                alert(`❌ การสมัครสมาชิกล้มเหลว: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = 'ยืนยันการสมัครสมาชิก';
            }
        }

        // ระบบเข้าสู่ระบบ (Login)
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login_email').value.trim();
            const password = document.getElementById('login_password').value;
            const btn = document.getElementById('btn-login');

            btn.disabled = true;
            btn.innerText = 'กำลังตรวจสอบ...';

            try {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error;

                currentUser = data.user;
                await fetchUserProfile(data.user.id);
                initDashboardUI();
            } catch (err) {
                alert(`❌ เข้าสู่ระบบไม่สำเร็จ: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = 'เข้าสู่ระบบ';
            }
        }

        // ดึงข้อมูล Role จากตาราง profiles
        async function fetchUserProfile(userId) {
            const { data, error } = await db
                .from('profiles')
                .select('*')
                .eq('id', userId)
                .single();

            if (!error && data) {
                userProfile = data;
            } else {
                userProfile = { fullname: 'ผู้ใช้งานทั่วไป', role: 'General User' };
            }
        }

        // ปรับการแสดงผลหน้าจอ Dashboard ตามสิทธิ์
        function initDashboardUI() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('user-info-bar').classList.remove('hidden');

            document.getElementById('nav-user-name').textContent = userProfile.fullname || currentUser.email;
            document.getElementById('nav-user-role').textContent = `สิทธิ์: ${userProfile.role}`;

            const isSafety = userProfile.role === 'Safety Officer (จป.)';
            const btnSafety = document.getElementById('btn-safety-menu');
            const badgeLock = document.getElementById('badge-lock');

            if (isSafety) {
                btnSafety.disabled = false;
                btnSafety.classList.remove('text-gray-400', 'bg-gray-50', 'cursor-not-allowed');
                btnSafety.classList.add('text-green-700', 'hover:bg-green-50');
                badgeLock.textContent = '✅ ปลดล็อก';
                badgeLock.classList.replace('bg-gray-200', 'bg-green-200');
                badgeLock.classList.replace('text-gray-500', 'text-green-800');
            }

            loadWorkPermitRequests();
        }

        // ระบบออกจากระบบ
        async function handleLogout() {
            await db.auth.signOut();
            window.location.reload();
        }

        // สลับแสดงผลหน้าย่อย
        function showPage(pageName) {
            document.getElementById('page-permit-form').classList.add('hidden');
            document.getElementById('page-status-tracker').classList.add('hidden');
            document.getElementById('page-safety-approval').classList.add('hidden');

            document.getElementById(`page-${pageName}`).classList.remove('hidden');

            if (pageName === 'status-tracker' || pageName === 'safety-approval') {
                loadWorkPermitRequests();
            }
        }

        // บันทึกคำขอ Work Permit
        async function handleWorkPermitSubmit(event) {
            event.preventDefault();
            const company = document.getElementById('wp_company').value;
            const location = document.getElementById('wp_location').value;
            const description = document.getElementById('wp_description').value;

            try {
                const { error } = await db.from('work_permit_requests').insert([{
                    user_id: currentUser.id,
                    applicant_name: userProfile.fullname,
                    company: company,
                    location: location,
                    description: description,
                    status: 'Pending'
                }]);

                if (error) throw error;

                alert('✅ ยื่นคำขอใบอนุญาตทำงานเรียบร้อยแล้ว!');
                event.target.reset();
                showPage('status-tracker');
            } catch (err) {
                alert('❌ ยื่นคำขอไม่สำเร็จ: ' + err.message);
            }
        }

        // โหลดข้อมูลคำขอทั้งหมด
        async function loadWorkPermitRequests() {
            const { data, error } = await db.from('work_permit_requests').select('*').order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            const statusContainer = document.getElementById('requests-list');
            statusContainer.innerHTML = data.length === 0 ? '<p class="text-gray-500">ยังไม่มีรายการคำขอ</p>' : '';
            
            const safetyContainer = document.getElementById('safety-approval-list');
            safetyContainer.innerHTML = '';

            data.forEach(item => {
                const card = `
                    <div class="p-4 border rounded-lg flex justify-between items-center">
                        <div>
                            <p class="font-bold text-gray-800">${item.company} (${item.location})</p>
                            <p class="text-sm text-gray-600">${item.description}</p>
                            <p class="text-xs text-gray-400">ผู้ยื่น: ${item.applicant_name}</p>
                        </div>
                        <div>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${getStatusBadge(item.status)}">
                                ${item.status}
                            </span>
                        </div>
                    </div>
                `;
                statusContainer.innerHTML += card;

                if (item.status === 'Pending') {
                    const safetyCard = `
                        <div class="p-4 border border-amber-200 bg-amber-50 rounded-lg flex justify-between items-center">
                            <div>
                                <p class="font-bold text-gray-800">${item.company} (${item.location})</p>
                                <p class="text-sm text-gray-600">${item.description}</p>
                                <p class="text-xs text-gray-500">ผู้ขออนุญาต: ${item.applicant_name}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="updateStatus('${item.id}', 'Approved')" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded hover:bg-green-700">อนุมัติ</button>
                                <button onclick="updateStatus('${item.id}', 'Rejected')" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded hover:bg-red-700">ไม่อนุมัติ</button>
                            </div>
                        </div>
                    `;
                    safetyContainer.innerHTML += safetyCard;
                }
            });

            if (safetyContainer.innerHTML === '') {
                safetyContainer.innerHTML = '<p class="text-gray-500">ไม่มีรายการที่รอการอนุมัติ</p>';
            }
        }

        // จป. กดเปลี่ยนสถานะ อนุมัติ / ไม่อนุมัติ
        async function updateStatus(requestId, newStatus) {
            if (userProfile.role !== 'Safety Officer (จป.)') {
                alert('❌ เฉพาะเจ้าหน้าที่ Safety เท่านั้นที่สามารถพิจารณาอนุมัติได้');
                return;
            }

            const { error } = await db
                .from('work_permit_requests')
                .update({ 
                    status: newStatus,
                    reviewed_by: userProfile.fullname,
                    reviewed_at: new Date()
                })
                .eq('id', requestId);

            if (error) {
                alert('❌ ปรับปรุงสถานะไม่สำเร็จ: ' + error.message);
            } else {
                alert(`✅ ปรับสถานะเป็น [${newStatus}] เรียบร้อยแล้ว`);
                loadWorkPermitRequests();
            }
        }

        function getStatusBadge(status) {
            switch (status) {
                case 'Approved': return 'bg-green-100 text-green-800';
                case 'Rejected': return 'bg-red-100 text-red-800';
                default: return 'bg-yellow-100 text-yellow-800';
            }
        }
    </script>
</body>
</html>
