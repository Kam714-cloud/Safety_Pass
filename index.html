<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUDI WORK PERMIT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}
body{margin:0;background:#f0f4f8;color:#1e293b}
.sidebar{background:#0f172a;color:white;padding:15px}
.sidebar h2{color:#38bdf8;text-align:center}
.sidebar-menu{display:flex;gap:8px;flex-wrap:wrap}
.menu-item{border:0;padding:12px;border-radius:8px;background:transparent;color:white;cursor:pointer}
.menu-item.active{background:#0284c7}
.main-content{padding:15px;flex:1;min-width:0}
.card-container{max-width:950px;margin:0 auto 20px;background:white;padding:22px;border-radius:12px;border:1px solid #e2e8f0}
.page-title{text-align:center;font-size:24px;margin-bottom:25px}
.section-title{color:#0369a1;font-size:19px;font-weight:bold;border-left:5px solid #0284c7;padding-left:12px;margin:28px 0 18px}
.form-grid{display:grid;grid-template-columns:1fr;gap:18px}
.form-group{min-width:0}
label{display:block;font-weight:bold;margin-bottom:8px;line-height:1.5}
.req{color:red}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=file],input[type=password],textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:white}
input[readonly]{background:#f1f5f9;color:#0284c7;font-weight:bold}
.options-group{display:flex;flex-direction:column;gap:12px}
.option-label{display:flex;align-items:center;gap:10px;font-weight:normal;cursor:pointer}
.option-label input{width:20px;height:20px;flex-shrink:0}
.other-input{display:block;margin:5px 0 12px 28px;width:calc(100% - 28px)!important}
.hidden{display:none!important}
.notice,.warning{padding:12px;border-radius:8px;margin-bottom:18px;line-height:1.6;font-size:14px}
.notice{background:#eff6ff;color:#1d4ed8}
.warning{background:#fff7ed;color:#9a3412}
.btn{padding:12px 16px;border:0;border-radius:7px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-primary{background:#0284c7;color:white}
.btn-success{background:#15803d;color:white}
.btn-danger{background:#dc2626;color:white}
.btn-warning{background:#d97706;color:white}
.btn-submit{width:100%;margin-top:24px}
.tab-switch,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tab-btn{padding:10px;border:0;border-radius:6px;background:#e2e8f0;cursor:pointer}
.tab-btn.active{background:#0284c7;color:white}
.record{border:1px solid #cbd5e1;border-radius:9px;padding:15px;margin-top:15px;overflow-wrap:anywhere}
.status{display:inline-block;padding:5px 10px;border-radius:20px;font-size:13px;font-weight:bold}
.status-Pending{background:#fef3c7;color:#92400e}
.status-Approved{background:#dcfce7;color:#166534}
.status-Rejected{background:#fee2e2;color:#991b1b}
.status-Revision{background:#ffedd5;color:#9a3412}
.muted{color:#64748b;font-size:13px;line-height:1.6}
.empty{padding:20px;text-align:center;background:#f8fafc;border-radius:8px}
.record-grid{display:grid;grid-template-columns:1fr;gap:8px}
textarea{resize:vertical}
hr{border:0;border-top:1px solid #e2e8f0;margin:20px 0}
button:focus,input:focus,textarea:focus{outline:2px solid #38bdf8;outline-offset:2px}
@media(min-width:768px){
body{display:flex}
.sidebar{width:240px;min-height:100vh;flex-shrink:0}
.sidebar-menu{flex-direction:column}
.menu-item{text-align:left}
.main-content{flex:1;padding:30px;min-width:0}
.card-container{padding:30px}
.form-grid,.record-grid{grid-template-columns:1fr 1fr}
.full-width{grid-column:1/-1}
}
</style>
</head>
<body>
<aside class="sidebar">
<h2>AUDI WORK PERMIT</h2>
<nav class="sidebar-menu">
<button type="button" class="menu-item active" id="menu-form" onclick="switchPage('form')">กรอกคำขอ</button>
<button type="button" class="menu-item" id="menu-track" onclick="switchPage('track')">ติดตามผล</button>
<button type="button" class="menu-item" id="menu-safety" onclick="switchPage('safety')">Safety Approval</button>
</nav>
</aside>
<main class="main-content">
<section id="page-form" class="card-container">
<h1 class="page-title">ระบบกรอกคำขอ Work Permit</h1>
<div class="warning">
<strong>หมายเหตุ:</strong> ระบบเชื่อมต่อฐานข้อมูล Supabase เรียบร้อยแล้ว
</div>
<form id="workPermitForm">
<div class="form-group">
<label>เลขที่ใบอนุญาตทำงาน (Work Permit No.) <span class="req">*</span></label>
<input type="text" id="wp_no" name="wp_no" readonly required>
</div>
<div class="section-title">ข้อมูลผู้ขออนุญาต</div>
<div class="form-grid">
<div class="form-group full-width">
<label>1. ชื่อบริษัท <span class="req">*</span></label>
<input type="text" name="q1" required placeholder="ใส่คำตอบ">
</div>
<div class="form-group full-width">
<label>2. ชื่อ-นามสกุล <span class="req">*</span></label>
<input type="text" name="q2" required placeholder="ใส่คำตอบ">
</div>
<div class="form-group full-width">
<label>3. รหัสพนักงาน/ผู้รับเหมา <span class="req">*</span></label>
<input type="text" name="q3" required placeholder="ใส่คำตอบ">
</div>
<div class="form-group full-width">
<label>4. Email <span class="req">*</span></label>
<input type="email" name="q4" required placeholder="name@company.com">
</div>
<div class="form-group full-width">
<label>5. แผนก <span class="req">*</span></label>
<div class="options-group">
<label class="option-label"><input type="radio" name="q5" value="Production" required> Production</label>
<label class="option-label"><input type="radio" name="q5" value="Maintenance"> Maintenance</label>
<label class="option-label"><input type="radio" name="q5" value="Warehouse"> Warehouse</label>
<label class="option-label"><input type="radio" name="q5" value="Engineering"> Engineering</label>
<label class="option-label"><input type="radio" name="q5" value="QC"> QC</label>
<label class="option-label"><input type="radio" name="q5" value="Other"> Other</label>
<input type="text" id="q5_other" name="q5_other" class="other-input hidden" placeholder="โปรดระบุแผนก">
</div>
</div>
<div class="form-group full-width">
<label>6. ตำแหน่งงาน <span class="req">*</span></label>
<input type="text" name="q6" required placeholder="ใส่คำตอบ">
</div>
</div>
<div class="section-title">Smart Work Permit</div>
<div class="form-grid">
<div class="form-group full-width">
<label>10. ลักษณะงาน/รายละเอียด <span class="req">*</span></label>
<input type="text" name="work_type" required placeholder="ระบุลักษณะงาน">
</div>
<div class="form-group full-width">
<label>13. รายชื่อผู้ปฏิบัติงาน <span class="req">*</span></label>
<textarea name="worker_name" rows="3" required placeholder="ใส่รายชื่อผู้ปฏิบัติงาน"></textarea>
</div>
<div class="form-group">
<label>15. วันที่เริ่มงาน <span class="req">*</span></label>
<input type="date" name="q15" required>
</div>
<div class="form-group">
<label>16. วันที่สิ้นสุดงาน <span class="req">*</span></label>
<input type="date" name="q16" required>
</div>
</div>
<button type="submit" class="btn btn-primary btn-submit">ยื่นคำขออนุญาตทำงาน</button>
</form>
</section>
<!-- ==================== TRACKING PAGE ==================== -->
<section id="page-track" class="card-container hidden">
 <h1 class="page-title">ติดตามสถานะ Work Permit</h1>
 <div class="form-group">
   <label for="tracking-search">เลขที่ Work Permit</label>
   <input type="text" id="tracking-search" placeholder="กรอกเลขที่ Work Permit">
 </div>
 <div class="actions">
   <button type="button" class="btn btn-primary" onclick="searchTracking()">ค้นหาสถานะ</button>
 </div>
 <div id="tracking-results">
   <div class="empty">กรอกข้อมูลเพื่อค้นหาสถานะคำขอ</div>
 </div>
</section>
<!-- ==================== SAFETY APPROVAL PAGE ==================== -->
<section id="page-safety" class="card-container hidden">
 <h1 class="page-title">Safety Approval</h1>
 <div id="safety-auth-box" class="card-container" style="background: #f8fafc; border: 1px dashed #cbd5e1; margin-bottom: 20px;">
   <h3 style="margin-top: 0; color: #0369a1;">🔒 กรุณากรอกรหัส PIN ผู้อำนวยความสะดวกด้านความปลอดภัย</h3>
   <div class="form-group" style="margin-top: 15px;">
     <label for="safety-pin-input">รหัส PIN 4 หลัก</label>
     <input type="password" id="safety-pin-input" placeholder="••••" maxlength="4" style="max-width: 200px;">
   </div>
   <div class="actions" style="margin-top: 15px;">
     <button type="button" class="btn btn-primary" onclick="verifySafetyPin()">ยืนยันรหัส PIN</button>
   </div>
   <div id="safety-auth-error" class="muted" style="color: #dc2626; margin-top: 10px; font-weight: bold;"></div>
 </div>
 <div id="safety-content-area" class="hidden">
   <div class="tab-switch">
     <button type="button" class="tab-btn active" id="tab-pending" onclick="filterSafety('Pending')">รออนุมัติ</button>
     <button type="button" class="tab-btn" id="tab-all" onclick="filterSafety('All')">คำขอทั้งหมด</button>
   </div>
   <div id="safety-results">
     <div class="empty">กำลังเตรียมรายการคำขอ...</div>
   </div>
 </div>
</section>
</main>
<script>
const CORRECT_SAFETY_PIN = '7185';
function verifySafetyPin() {
  const pinInput = document.getElementById('safety-pin-input');
  const errorDiv = document.getElementById('safety-auth-error');
  const authBox = document.getElementById('safety-auth-box');
  const contentArea = document.getElementById('safety-content-area');
  if (pinInput && pinInput.value === CORRECT_SAFETY_PIN) {
    if (authBox) authBox.classList.add('hidden');
    if (contentArea) contentArea.classList.remove('hidden');
    loadSafetyRequests();
  } else {
    if (errorDiv) errorDiv.textContent = 'รหัส PIN ไม่ถูกต้อง';
    if (pinInput) pinInput.value = '';
  }
}
const SUPABASE_URL = 'https://oqthxncwleedvccganmg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_bhnJ7U04RVjyByqFE5bqiQ_Qa_ffBNJ';
const TABLE_NAME = 'work_permit_requests';
let supabaseClient = null;
let allSafetyRequests = [];
let currentSafetyFilter = 'Pending';

document.addEventListener('DOMContentLoaded', function () {
 if (window.supabase && window.supabase.createClient) {
   supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
 }
 setInitialWPNumber();
 const form = document.getElementById('workPermitForm');
 if (form) {
   form.addEventListener('submit', submitWorkPermit);
 }
});

function generateWPNumber() {
 const now = new Date();
 const dateKey = String(now.getDate()).padStart(2, '0') + String(now.getMonth() + 1).padStart(2, '0');
 const randomSuffix = Math.floor(1000 + Math.random() * 9000);
 return `AA_${dateKey}_${randomSuffix}`;
}
function setInitialWPNumber() {
 const input = document.getElementById('wp_no');
 if (input && !input.value) input.value = generateWPNumber();
}
function switchPage(pageName) {
 ['form', 'track', 'safety'].forEach(key => {
   const page = document.getElementById(`page-${key}`);
   if (page) page.classList.toggle('hidden', key !== pageName);
   const menu = document.getElementById(`menu-${key}`);
   if (menu) menu.classList.toggle('active', key === pageName);
 });
 if (pageName === 'safety') loadSafetyRequests();
}

async function submitWorkPermit(event) {
 event.preventDefault();
 const form = event.currentTarget;
 if (!supabaseClient) {
   alert('ยังเชื่อมต่อ Supabase ไม่สำเร็จ');
   return;
 }
 const submitButton = form.querySelector('button[type="submit"]');
 submitButton.disabled = true;
 submitButton.textContent = 'กำลังบันทึกคำขอ...';

 try {
   const requestRecord = {
     wp_no: form.elements.wp_no.value,
     work_type: form.elements.work_type.value,
     worker_name: form.elements.worker_name.value,
     status: 'Pending'
   };

   const { error } = await supabaseClient.from(TABLE_NAME).insert(requestRecord);
   if (error) {
     throw new Error(error.message);
   }

   alert('ส่งคำขอสำเร็จ! เลขที่ Work Permit: ' + requestRecord.wp_no);
   form.reset();
   setInitialWPNumber();
 } catch (error) {
   alert('เกิดข้อผิดพลาด: ' + error.message);
 } finally {
   submitButton.disabled = false;
   submitButton.textContent = 'ยื่นคำขออนุญาตทำงาน';
 }
}

async function searchTracking() {
 const keyword = document.getElementById('tracking-search').value.trim();
 const results = document.getElementById('tracking-results');
 if (!keyword) return;
 
 const { data, error } = await supabaseClient.from(TABLE_NAME).select('*').eq('wp_no', keyword);
 if (error || !data.length) {
   results.innerHTML = '<div class="empty">ไม่พบรายการ</div>';
   return;
 }
 results.innerHTML = data.map(r => `
   <article class="record">
     <h3>${r.wp_no}</h3>
     <p><strong>ลักษณะงาน:</strong> ${r.work_type || '-'}</p>
     <p><strong>สถานะ:</strong> <span class="status status-${r.status || 'Pending'}">${r.status || 'Pending'}</span></p>
   </article>
 `).join('');
}

async function loadSafetyRequests() {
 const results = document.getElementById('safety-results');
 const { data, error } = await supabaseClient.from(TABLE_NAME).select('*');
 if (error) {
   results.innerHTML = '<div class="empty">โหลดรายการไม่สำเร็จ</div>';
   return;
 }
 allSafetyRequests = data || [];
 renderSafetyRequests();
}

function renderSafetyRequests() {
 const results = document.getElementById('safety-results');
 let records = allSafetyRequests;
 if (currentSafetyFilter === 'Pending') {
   records = records.filter(r => (r.status || 'Pending') === 'Pending');
 }
 if (!records.length) {
   results.innerHTML = '<div class="empty">ไม่พบรายการคำขอ</div>';
   return;
 }
 results.innerHTML = records.map(r => `
   <article class="record">
     <h3>${r.wp_no}</h3>
     <p><strong>ลักษณะงาน:</strong> ${r.work_type || '-'}</p>
     <p><strong>รายชื่อ:</strong> ${r.worker_name || '-'}</p>
     <p><strong>สถานะ:</strong> <span class="status status-${r.status || 'Pending'}">${r.status || 'Pending'}</span></p>
     <div class="actions">
       <button class="btn btn-success" onclick="updateStatus('${r.wp_no}', 'Approved')">อนุมัติ</button>
       <button class="btn btn-danger" onclick="updateStatus('${r.wp_no}', 'Rejected')">ไม่อนุมัติ</button>
     </div>
   </article>
 `).join('');
}

async function updateStatus(wpNo, newStatus) {
 const { error } = await supabaseClient.from(TABLE_NAME).update({ status: newStatus }).eq('wp_no', wpNo);
 if (error) {
   alert('อัปเดตสถานะไม่สำเร็จ: ' + error.message);
   return;
 }
 alert('อัปเดตสถานะเรียบร้อยแล้ว');
 loadSafetyRequests();
}
</script>
</body>
</html>
